[project]
name = "how-many-prompts"
version = "0.1.0"
description = "Statistical power analysis for secret-loyalty audit detection rates."
readme = "README.md"
requires-python = ">=3.13.5,<3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[project.scripts]
how-many-prompts = "how_many_prompts:main"
validate-table5 = "how_many_prompts.sources.lamerton_roger_2026:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/how_many_prompts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
