[project]
name = "how-many-prompts"
version = "0.1.0"
description = "Statistical power analysis for secret-loyalty audit detection rates."
readme = "README.md"
requires-python = ">=3.13.5,<3.14"
dependencies = []

[project.scripts]
how-many-prompts = "main:main"
validate-table5 = "lamerton_roger_2026:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
include = ["main.py", "lamerton_roger_2026.py"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
